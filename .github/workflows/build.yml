name: Build KSDB Studio

on:
  # Publier une release sur GitHub (avec un nouveau tag vX.Y.Z) suffit :
  # Windows et Linux sont compilés puis joints automatiquement.
  release:
    types: [published]
  push:
    tags: ['v*']
  # Recompiler et (re)joindre les fichiers à une release existante : Actions → Run workflow → tag
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release à compléter (ex. v1.5.2) ; vide = simple compilation'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: dist:win
          - os: ubuntu-latest
            target: dist:linux
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version alignée sur le tag
        if: env.TAG != ''
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"
      - run: npm run typecheck
      - run: npm run test:vpn
      - run: npm run test:update
      - run: npm run ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ksdb-studio-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
      - name: Joindre à la release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
